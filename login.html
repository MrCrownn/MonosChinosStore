<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Monos Chinos Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar simple para login -->
  <nav class="navbar navbar-mcs">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-accent">Monos</span> Chinos Store
      </a>
    </div>
  </nav>

  <main class="container py-5" style="max-width:420px;">
    <div class="login-card shadow-sm p-4 p-md-5">

      <div class="text-center mb-4">
        <a href="index.html" class="text-decoration-none">
          <span class="brand-accent" style="font-size:1.75rem;font-weight:800;">Monos</span><span style="font-size:1.75rem;font-weight:800;color:var(--negro);"> Chinos Store</span>
        </a>
      </div>

      <h1 class="h4 text-center mb-1">Panel de Administración</h1>
      <p class="text-center text-muted mb-4">Ingresa con tu usuario y contraseña</p>

      <div id="alerta" class="alert alert-danger d-none mb-3"></div>

      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="usuario" maxlength="30" autocomplete="username" autofocus placeholder="admin">
      </div>

      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="clave" maxlength="64" autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="button" class="btn btn-rojo w-100 py-2" id="btnEntrar">Entrar</button>

      <hr class="my-4">
      <p class="small text-center text-muted mb-0">
        Cuentas de prueba:<br>
        <code>admin / Admin123</code> — administrador<br>
        <code>jperez / User123</code> — usuario
      </p>

    </div>

    <p class="text-center mt-4">
      <a href="index.html" class="text-decoration-none text-muted small">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="me-1" style="vertical-align:-2px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Volver a la tienda
      </a>
    </p>
  </main>

  <!-- Footer mínimo -->
  <footer class="footer-mcs" style="margin-top:auto;padding:1.5rem 0;">
    <div class="container text-center">
      <p class="mb-0 small">&copy; 2026 Monos Chinos Store. Panel de administración.</p>
    </div>
  </footer>

<script>
var SEED_USUARIOS = [
  { id:1, usuario:"admin",  nombre:"Administrador",    email:"admin@demo.cl",  clave:"Admin123", rol:"admin", activo:true  },
  { id:2, usuario:"ncorona", nombre:"Nicolás Corona",   email:"ncorona@demo.cl", clave:"12345678",  rol:"Vendedor",  activo:true  },
  { id:3, usuario:"igarin", nombre:"Ignacio Garín",  email:"igarin@demo.cl", clave:"12345678",  rol:"user",activo:false  },
];

var KEY_SESION   = "mcs_sesion";
var KEY_INTENTOS = "mcs_intentos";
var MAX_INTENTOS = 5;
var BLOQUEO_MS   = 60000;

var alerta     = document.getElementById("alerta");
var inpUsuario = document.getElementById("usuario");
var inpClave   = document.getElementById("clave");
var btnEntrar  = document.getElementById("btnEntrar");

if (sessionStorage.getItem(KEY_SESION)) {
  window.location.href = "productos.html";
}

btnEntrar.addEventListener("click", entrar);
inpUsuario.addEventListener("keydown", function(e) { if (e.key === "Enter") inpClave.focus(); });
inpClave.addEventListener("keydown",   function(e) { if (e.key === "Enter") entrar(); });

function entrar() {
  ocultarError();

  var espera = bloqueoRestante();
  if (espera > 0) {
    mostrarError("Demasiados intentos fallidos. Espera " + espera + " segundos.");
    return;
  }

  var usuario = inpUsuario.value.trim();
  var clave   = inpClave.value;

  if (!usuario || !clave) {
    mostrarError("Escribe tu usuario y tu contraseña.");
    return;
  }

  var encontrado = null;
  for (var i = 0; i < SEED_USUARIOS.length; i++) {
    if (SEED_USUARIOS[i].usuario.toLowerCase() === usuario.toLowerCase() && SEED_USUARIOS[i].clave === clave) {
      encontrado = SEED_USUARIOS[i];
      break;
    }
  }

  if (!encontrado) {
    registrarFallo();
    mostrarError("Usuario o contraseña incorrectos.");
    inpClave.value = "";
    return;
  }

  if (!encontrado.activo) {
    mostrarError("Tu cuenta está desactivada. Contacta al administrador.");
    return;
  }

  localStorage.removeItem(KEY_INTENTOS);

  sessionStorage.setItem(KEY_SESION, JSON.stringify({
    id:      encontrado.id,
    usuario: encontrado.usuario,
    nombre:  encontrado.nombre,
    rol:     encontrado.rol,
    expira:  Date.now() + 30 * 60 * 1000
  }));

  window.location.href = "productos.html";
}

function mostrarError(msg) {
  alerta.textContent = msg;
  alerta.classList.remove("d-none");
}

function ocultarError() {
  alerta.classList.add("d-none");
  alerta.textContent = "";
}

function bloqueoRestante() {
  var d = JSON.parse(localStorage.getItem(KEY_INTENTOS) || '{"n":0,"hasta":0}');
  return d.hasta > Date.now() ? Math.ceil((d.hasta - Date.now()) / 1000) : 0;
}

function registrarFallo() {
  var d = JSON.parse(localStorage.getItem(KEY_INTENTOS) || '{"n":0,"hasta":0}');
  d.n++;
  if (d.n >= MAX_INTENTOS) { d.hasta = Date.now() + BLOQUEO_MS; d.n = 0; }
  localStorage.setItem(KEY_INTENTOS, JSON.stringify(d));
}
</script>

</body>
</html>
